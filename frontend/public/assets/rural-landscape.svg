<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bfe4f5"/>
    <stop offset=".55" stop-color="#edf7fa"/>
    <stop offset="1" stop-color="#f6e9c9"/>
  </linearGradient>

  <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8faec4"/>
    <stop offset="1" stop-color="#526f7b"/>
  </linearGradient>

  <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#82c96b"/>
    <stop offset="1" stop-color="#1f7d45"/>
  </linearGradient>

  <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8fd0e6"/>
    <stop offset="1" stop-color="#247ea4"/>
  </linearGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <radialGradient id="sun">
    <stop offset="0" stop-color="#fff9ce" stop-opacity=".95"/>
    <stop offset="1" stop-color="#ffd66b" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- sky -->
<rect width="1600" height="900" fill="url(#sky)"/>

<!-- soft clouds -->
<g fill="#fff" opacity=".55" filter="url(#blur)">
  <ellipse cx="250" cy="160" rx="190" ry="55"/>
  <ellipse cx="780" cy="115" rx="210" ry="60"/>
  <ellipse cx="1310" cy="190" rx="240" ry="65"/>
</g>

<!-- sun -->
<circle cx="690" cy="540" r="180" fill="url(#sun)"/>
<circle cx="690" cy="540" r="45" fill="#ffe79a" opacity=".65"/>

<!-- distant mountains -->
<path
 d="M0 490 L170 300 L270 430 L420 235 L560 430 L720 250 L870 430 L1040 220 L1170 410 L1330 280 L1490 430 L1600 330 L1600 650 L0 650Z"
 fill="url(#mountain)"
 opacity=".65"/>

<!-- snow peaks -->
<g fill="#f7fbfc" opacity=".8">
 <path d="M420 235 L365 320 L420 285 L450 315 L490 275 L420 235Z"/>
 <path d="M720 250 L665 330 L720 292 L755 325 L790 280 L720 250Z"/>
 <path d="M1040 220 L975 310 L1040 270 L1075 310 L1120 255 L1040 220Z"/>
</g>

<!-- village hillside -->
<path
 d="M0 540 Q260 455 480 535 Q700 610 930 500 Q1170 395 1600 520 L1600 900 L0 900Z"
 fill="#7caf62"/>

<!-- river -->
<path
 d="M620 900
    C760 790 790 690 700 620
    C640 570 700 530 850 560
    C1040 600 1060 700 970 760
    C890 815 930 860 1100 900Z"
 fill="url(#river)"
 opacity=".9"/>

<!-- river highlights -->
<path d="M690 625 Q820 690 760 790 Q735 830 800 880"
 fill="none" stroke="#d8f4fb" stroke-width="8" opacity=".55"/>

<!-- agricultural plots -->
<g stroke="#d5efb8" stroke-width="3" opacity=".75">
 <path d="M0 650 L270 585 L420 900 L0 900Z" fill="url(#field)"/>
 <path d="M270 585 L520 540 L640 900 L420 900Z" fill="#58aa54"/>
 <path d="M520 540 L735 555 L760 900 L640 900Z" fill="#91c95f"/>
 <path d="M735 555 L930 510 L1040 900 L760 900Z" fill="#4f9f4f"/>
 <path d="M930 510 L1180 470 L1340 900 L1040 900Z" fill="#79bd5c"/>
 <path d="M1180 470 L1600 520 L1600 900 L1340 900Z" fill="#3f914b"/>

 <path d="M90 620 L210 900"/>
 <path d="M350 565 L470 900"/>
 <path d="M590 550 L680 900"/>
 <path d="M840 530 L900 900"/>
 <path d="M1070 490 L1190 900"/>
 <path d="M1300 485 L1450 900"/>
</g>

<!-- village houses -->
<g stroke="#694b34" stroke-width="3">
 <g transform="translate(110 580)">
   <rect x="0" y="38" width="75" height="55" fill="#f3d8ad"/>
   <path d="M-10 40 L38 0 L85 40Z" fill="#a94731"/>
   <rect x="30" y="62" width="16" height="31" fill="#70452e"/>
   <rect x="9" y="53" width="15" height="13" fill="#8cc3d1"/>
   <rect x="52" y="53" width="15" height="13" fill="#8cc3d1"/>
 </g>

 <g transform="translate(220 535) scale(.8)">
   <rect x="0" y="38" width="75" height="55" fill="#ead0a4"/>
   <path d="M-10 40 L38 0 L85 40Z" fill="#a84b35"/>
   <rect x="30" y="62" width="16" height="31" fill="#70452e"/>
 </g>

 <g transform="translate(350 610) scale(.72)">
   <rect x="0" y="38" width="75" height="55" fill="#f0d7ae"/>
   <path d="M-10 40 L38 0 L85 40Z" fill="#a94d34"/>
   <rect x="30" y="62" width="16" height="31" fill="#70452e"/>
 </g>

 <g transform="translate(480 565) scale(.75)">
   <rect x="0" y="38" width="75" height="55" fill="#ead0a4"/>
   <path d="M-10 40 L38 0 L85 40Z" fill="#b04d31"/>
   <rect x="30" y="62" width="16" height="31" fill="#70452e"/>
 </g>
</g>

<!-- trees -->
<g>
 <g transform="translate(70 510)">
   <rect x="15" y="45" width="12" height="65" fill="#61472e"/>
   <circle cx="20" cy="38" r="42" fill="#3b8448"/>
   <circle cx="-5" cy="52" r="27" fill="#4e9950"/>
   <circle cx="46" cy="50" r="30" fill="#327a42"/>
 </g>

 <g transform="translate(560 500)">
   <rect x="15" y="45" width="12" height="70" fill="#61472e"/>
   <circle cx="20" cy="38" r="45" fill="#397f43"/>
   <circle cx="-10" cy="50" r="27" fill="#58a653"/>
   <circle cx="50" cy="52" r="30" fill="#347b40"/>
 </g>

 <g transform="translate(1180 465)">
   <rect x="15" y="45" width="12" height="70" fill="#61472e"/>
   <circle cx="20" cy="38" r="45" fill="#397f43"/>
   <circle cx="-10" cy="50" r="27" fill="#58a653"/>
   <circle cx="50" cy="52" r="30" fill="#347b40"/>
 </g>
</g>

<!-- bridge -->
<g stroke="#705b4a">
 <path d="M760 650 Q900 625 1030 690" fill="none" stroke-width="22"/>
 <path d="M760 650 Q900 625 1030 690" fill="none" stroke="#bba48a" stroke-width="13"/>
 <path d="M790 645 L790 710 M850 637 L850 700 M915 645 L915 710 M980 665 L980 730 M1030 690 L1030 750"
       stroke-width="8"/>
</g>

<!-- foreground glow -->
<rect y="700" width="1600" height="200" fill="#0b5635" opacity=".08"/>

</svg>
